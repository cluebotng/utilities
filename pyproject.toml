[project]
name = "utilities"
requires-python = ">=3.13"

[tool.poetry]
package-mode = false

[tool.poetry.group.test.dependencies]
tox = ">=4.67.4"
tox-current-env = ">=0.0.17"
black = "*"
ruff = "*"

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
