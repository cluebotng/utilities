[project]
name = "utilities"
requires-python = ">=3.13"

[tool.poetry]
package-mode = false

[tool.poetry.group.test.dependencies]
black = ">=26.10.1"
ruff = ">=0.17.3"

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
